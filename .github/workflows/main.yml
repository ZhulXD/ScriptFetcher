name: win 11 + tailscale + RDP timer

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Record Session End Time
        run: |
          # Job timeout is 350 min; end time is set slightly earlier as a margin
          $end = (Get-Date).ToUniversalTime().AddMinutes(348)
          $end.ToString("o") | Set-Content -Path "C:\Users\Public\rdp_end.txt" -Encoding ascii

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP only from the Tailscale network range (100.64.0.0/10)
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # Disable account lockout and make sure the account is active/unlocked
          net accounts /lockoutthreshold:0
          net user RDP /active:yes

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Generate Tailscale Auth Key via API
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"

          # 1) Exchange the OAuth client for an access token
          $tok = Invoke-RestMethod -Method Post `
            -Uri "https://api.tailscale.com/api/v2/oauth/token" `
            -Body @{
              client_id     = $env:TS_CLIENT_ID
              client_secret = $env:TS_CLIENT_SECRET
              grant_type    = "client_credentials"
            }

          # 2) Create a fresh auth key: single use, ephemeral, valid for 10 minutes
          $body = @{
            expirySeconds = 600
            capabilities  = @{
              devices = @{
                create = @{
                  reusable      = $false
                  ephemeral     = $true
                  preauthorized = $true
                  tags          = @("tag:ci")
                }
              }
            }
          } | ConvertTo-Json -Depth 6

          $key = Invoke-RestMethod -Method Post `
            -Uri "https://api.tailscale.com/api/v2/tailnet/-/keys" `
            -Headers @{ Authorization = "Bearer $($tok.access_token)" } `
            -ContentType "application/json" `
            -Body $body

          if (-not $key.key) {
              Write-Error "Failed to create Tailscale auth key."
              exit 1
          }

          # Mask in logs, then pass to the next step
          Write-Host "::add-mask::$($key.key)"
          "TS_AUTHKEY=$($key.key)" >> $env:GITHUB_ENV

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TS_AUTHKEY --hostname=gh-runner-$env:GITHUB_RUN_ID

          # Wait until Tailscale gets an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Setup Desktop Apps
        run: |
          $ProgressPreference = 'SilentlyContinue'

          # 7-Zip (silent install)
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2501-x64.exe" -OutFile "$env:TEMP\7zip.exe" -UseBasicParsing
          Start-Process "$env:TEMP\7zip.exe" -ArgumentList "/S" -Wait
          Remove-Item "$env:TEMP\7zip.exe" -Force

          # VMQuickConfig (placed on the public desktop)
          Invoke-WebRequest -Uri "https://github.com/chieunhatnang/VM-QuickConfig/releases/download/1.6.1/VMQuickConfig.exe" `
            -OutFile "C:\Users\Public\Desktop\VMQuickConfig.exe" -UseBasicParsing

          # Remove unwanted desktop shortcuts
          Remove-Item "C:\Users\Public\Desktop\Epic Games Launcher.lnk" -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Users\Public\Desktop\Unity Hub.lnk" -Force -ErrorAction SilentlyContinue

      - name: Setup RDP Timer Overlay
        run: |
          $timerScript = @'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $endFile = "C:\Users\Public\rdp_end.txt"
          if (-not (Test-Path $endFile)) { exit }
          $end = [DateTime]::Parse(
              (Get-Content $endFile -Raw).Trim(),
              [System.Globalization.CultureInfo]::InvariantCulture,
              [System.Globalization.DateTimeStyles]::RoundtripKind
          )

          $colorNormal = [System.Drawing.Color]::FromArgb(32, 32, 32)
          $colorWarn   = [System.Drawing.Color]::FromArgb(176, 112, 0)
          $colorDanger = [System.Drawing.Color]::FromArgb(160, 30, 30)

          # Small borderless always-on-top window
          $form = New-Object System.Windows.Forms.Form
          $form.FormBorderStyle = 'None'
          $form.StartPosition = 'Manual'
          $form.TopMost = $true
          $form.ShowInTaskbar = $false
          $form.Opacity = 0.9
          $form.Size = New-Object System.Drawing.Size(230, 34)
          $form.BackColor = $colorNormal

          # Start at the top center of the screen
          $area = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
          $x = [int](($area.Width - $form.Width) / 2)
          $form.Location = New-Object System.Drawing.Point($x, 6)

          $label = New-Object System.Windows.Forms.Label
          $label.Dock = 'Fill'
          $label.TextAlign = 'MiddleCenter'
          $label.ForeColor = [System.Drawing.Color]::White
          $label.Font = New-Object System.Drawing.Font('Segoe UI', 12, [System.Drawing.FontStyle]::Bold)
          $form.Controls.Add($label)

          # Drag with the left mouse button
          $script:dragging = $false
          $script:startX = 0
          $script:startY = 0

          $onDown = {
              if ($_.Button -eq [System.Windows.Forms.MouseButtons]::Left) {
                  $script:dragging = $true
                  $script:startX = $_.X
                  $script:startY = $_.Y
              }
          }
          $onMove = {
              if ($script:dragging) {
                  $p = [System.Windows.Forms.Control]::MousePosition
                  $form.Location = New-Object System.Drawing.Point(($p.X - $script:startX), ($p.Y - $script:startY))
              }
          }
          $onUp = { $script:dragging = $false }

          foreach ($c in @($form, $label)) {
              $c.Add_MouseDown($onDown)
              $c.Add_MouseMove($onMove)
              $c.Add_MouseUp($onUp)
          }

          # Right-click menu to close the timer
          $menu = New-Object System.Windows.Forms.ContextMenuStrip
          $closeItem = $menu.Items.Add('Close timer')
          $closeItem.Add_Click({ $form.Close() })
          $form.ContextMenuStrip = $menu
          $label.ContextMenuStrip = $menu

          # Update the countdown every second
          $update = {
              $left = $end - (Get-Date).ToUniversalTime()
              if ($left.TotalSeconds -le 0) {
                  $label.Text = 'RDP session ended'
                  $form.BackColor = $colorDanger
                  return
              }
              $label.Text = 'RDP time left  {0:00}:{1:00}:{2:00}' -f [int][math]::Floor($left.TotalHours), $left.Minutes, $left.Seconds
              if ($left.TotalMinutes -le 15) { $form.BackColor = $colorDanger }
              elseif ($left.TotalMinutes -le 60) { $form.BackColor = $colorWarn }
              else { $form.BackColor = $colorNormal }
          }

          $timer = New-Object System.Windows.Forms.Timer
          $timer.Interval = 1000
          $timer.Add_Tick($update)
          & $update
          $timer.Start()

          [void][System.Windows.Forms.Application]::Run($form)
          '@

          Set-Content -Path "C:\Users\Public\rdp_timer.ps1" -Value $timerScript -Encoding UTF8

          # Launch the timer automatically when any user logs in (All Users Startup folder)
          $startup = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $launcher = 'start "" /min powershell -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\Users\Public\rdp_timer.ps1"'
          Set-Content -Path "$startup\rdp_timer.cmd" -Value $launcher -Encoding ascii

          Write-Host "Timer overlay installed."

      - name: Keep Runner Alive
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: MR.English2008"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - cancel the workflow to terminate"
              Start-Sleep -Seconds 300
          }
