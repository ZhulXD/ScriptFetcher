name: win 11 + tailscale + RDP timer

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      RDP_PASSWORD: "MR.English2008"

    steps:
      - name: Record Session End Time
        run: |
          # Job timeout is 350 min; end time is set slightly earlier as a margin
          $end = (Get-Date).ToUniversalTime().AddMinutes(348)
          $end.ToString("o") | Set-Content -Path "C:\Users\Public\rdp_end.txt" -Encoding ascii

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP only from the Tailscale network range (100.64.0.0/10)
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = $env:RDP_PASSWORD
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          Add-LocalGroupMember -Group "Users" -Member "RDP"

          # Disable account lockout and make sure the account is active/unlocked
          net accounts /lockoutthreshold:0
          net user RDP /active:yes

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Generate Tailscale Auth Key via API
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"

          # 1) Exchange the OAuth client for an access token
          $tok = Invoke-RestMethod -Method Post `
            -Uri "https://api.tailscale.com/api/v2/oauth/token" `
            -Body @{
              client_id     = $env:TS_CLIENT_ID
              client_secret = $env:TS_CLIENT_SECRET
              grant_type    = "client_credentials"
            }

          # 2) Create a fresh auth key: single use, ephemeral, valid for 10 minutes
          $body = @{
            expirySeconds = 600
            capabilities  = @{
              devices = @{
                create = @{
                  reusable      = $false
                  ephemeral     = $true
                  preauthorized = $true
                  tags          = @("tag:ci")
                }
              }
            }
          } | ConvertTo-Json -Depth 6

          $key = Invoke-RestMethod -Method Post `
            -Uri "https://api.tailscale.com/api/v2/tailnet/-/keys" `
            -Headers @{ Authorization = "Bearer $($tok.access_token)" } `
            -ContentType "application/json" `
            -Body $body

          if (-not $key.key) {
              Write-Error "Failed to create Tailscale auth key."
              exit 1
          }

          # Mask in logs, then pass to the next step
          Write-Host "::add-mask::$($key.key)"
          "TS_AUTHKEY=$($key.key)" >> $env:GITHUB_ENV

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TS_AUTHKEY --hostname=gh-runner-$env:GITHUB_RUN_ID

          # Wait until Tailscale gets an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Setup Desktop Apps
        run: |
          $ProgressPreference = 'SilentlyContinue'

          # 7-Zip (silent install)
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2501-x64.exe" -OutFile "$env:TEMP\7zip.exe" -UseBasicParsing
          Start-Process "$env:TEMP\7zip.exe" -ArgumentList "/S" -Wait
          Remove-Item "$env:TEMP\7zip.exe" -Force

          # VMQuickConfig (placed on the public desktop)
          Invoke-WebRequest -Uri "https://github.com/chieunhatnang/VM-QuickConfig/releases/download/1.6.1/VMQuickConfig.exe" `
            -OutFile "C:\Users\Public\Desktop\VMQuickConfig.exe" -UseBasicParsing

          # Remove unwanted desktop shortcuts
          Remove-Item "C:\Users\Public\Desktop\Epic Games Launcher.lnk" -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Users\Public\Desktop\Unity Hub.lnk" -Force -ErrorAction SilentlyContinue

      - name: Setup RDP Timer Overlay
        run: |
          $timerScript = @'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $endFile = "C:\Users\Public\rdp_end.txt"
          if (-not (Test-Path $endFile)) { exit }
          $end = [DateTime]::Parse(
              (Get-Content $endFile -Raw).Trim(),
              [System.Globalization.CultureInfo]::InvariantCulture,
              [System.Globalization.DateTimeStyles]::RoundtripKind
          )

          $colorNormal = [System.Drawing.Color]::FromArgb(32, 32, 32)
          $colorWarn   = [System.Drawing.Color]::FromArgb(176, 112, 0)
          $colorDanger = [System.Drawing.Color]::FromArgb(160, 30, 30)

          # Small borderless always-on-top window
          $form = New-Object System.Windows.Forms.Form
          $form.FormBorderStyle = 'None'
          $form.StartPosition = 'Manual'
          $form.TopMost = $true
          $form.ShowInTaskbar = $false
          $form.Opacity = 0.9
          $form.Size = New-Object System.Drawing.Size(230, 34)
          $form.BackColor = $colorNormal

          # Start at the top center of the screen
          $area = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
          $x = [int](($area.Width - $form.Width) / 2)
          $form.Location = New-Object System.Drawing.Point($x, 6)

          $label = New-Object System.Windows.Forms.Label
          $label.Dock = 'Fill'
          $label.TextAlign = 'MiddleCenter'
          $label.ForeColor = [System.Drawing.Color]::White
          $label.Font = New-Object System.Drawing.Font('Segoe UI', 12, [System.Drawing.FontStyle]::Bold)
          $form.Controls.Add($label)

          # Drag with the left mouse button
          $script:dragging = $false
          $script:startX = 0
          $script:startY = 0

          $onDown = {
              if ($_.Button -eq [System.Windows.Forms.MouseButtons]::Left) {
                  $script:dragging = $true
                  $script:startX = $_.X
                  $script:startY = $_.Y
              }
          }
          $onMove = {
              if ($script:dragging) {
                  $p = [System.Windows.Forms.Control]::MousePosition
                  $form.Location = New-Object System.Drawing.Point(($p.X - $script:startX), ($p.Y - $script:startY))
              }
          }
          $onUp = { $script:dragging = $false }

          foreach ($c in @($form, $label)) {
              $c.Add_MouseDown($onDown)
              $c.Add_MouseMove($onMove)
              $c.Add_MouseUp($onUp)
          }

          # Right-click menu to close the timer
          $menu = New-Object System.Windows.Forms.ContextMenuStrip
          $closeItem = $menu.Items.Add('Close timer')
          $closeItem.Add_Click({ $form.Close() })
          $form.ContextMenuStrip = $menu
          $label.ContextMenuStrip = $menu

          # Update the countdown every second
          $update = {
              $left = $end - (Get-Date).ToUniversalTime()
              if ($left.TotalSeconds -le 0) {
                  $label.Text = 'RDP session ended'
                  $form.BackColor = $colorDanger
                  return
              }
              $label.Text = 'RDP time left  {0:00}:{1:00}:{2:00}' -f [int][math]::Floor($left.TotalHours), $left.Minutes, $left.Seconds
              if ($left.TotalMinutes -le 15) { $form.BackColor = $colorDanger }
              elseif ($left.TotalMinutes -le 60) { $form.BackColor = $colorWarn }
              else { $form.BackColor = $colorNormal }
          }

          $timer = New-Object System.Windows.Forms.Timer
          $timer.Interval = 1000
          $timer.Add_Tick($update)
          & $update
          $timer.Start()

          [void][System.Windows.Forms.Application]::Run($form)
          '@

          Set-Content -Path "C:\Users\Public\rdp_timer.ps1" -Value $timerScript -Encoding UTF8

          # Launch the timer automatically when any user logs in (All Users Startup folder)
          $startup = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $launcher = 'start "" /min powershell -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\Users\Public\rdp_timer.ps1"'
          Set-Content -Path "$startup\rdp_timer.cmd" -Value $launcher -Encoding ascii

          Write-Host "Timer overlay installed."

      - name: Kit Phase 1 - Download
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "C:\Users\Public\Downloads" | Out-Null

          $downloads = @(
            @{ Url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"; File = "ghidra.zip" },
            @{ Url = "https://github.com/bethington/ghidra-mcp/releases/download/v7.0.0/GhidraMCP-7.0.0.zip"; File = "GhidraMCP.zip" },
            @{ Url = "https://download.qoder.com/qoder-app/releases/latest/Qoder-win-x64-user.exe"; File = "Qoder-win-x64-user.exe" },
            @{ Url = "https://download.oracle.com/java/21/archive/jdk-21.0.12.1_windows-x64_bin.msi"; File = "jdk21.msi" }
          )

          # Download everything in parallel to save time
          $downloads | ForEach-Object -Parallel {
              $ProgressPreference = 'SilentlyContinue'
              $dest = Join-Path "C:\Users\Public\Downloads" $_.File
              Invoke-WebRequest -Uri $_.Url -OutFile $dest -UseBasicParsing
              Write-Host "Downloaded: $($_.File)"
          } -ThrottleLimit 4

          # Make sure every file really arrived
          foreach ($d in $downloads) {
              $p = Join-Path "C:\Users\Public\Downloads" $d.File
              if (-not (Test-Path $p) -or (Get-Item $p).Length -eq 0) {
                  throw "Download failed: $($d.File)"
              }
          }
          # Desktop shortcut so the Downloads folder is easy to find
          $shell = New-Object -ComObject WScript.Shell
          $dl = $shell.CreateShortcut("C:\Users\Public\Desktop\Downloads.lnk")
          $dl.TargetPath = "C:\Users\Public\Downloads"
          $dl.Save()
          Write-Host "Phase 1 done: all files downloaded to C:\Users\Public\Downloads"

      - name: Kit Phase 2a - Install system-wide (Java, Ghidra, Qoder)
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = 'SilentlyContinue'

          function Add-MachinePath($dir) {
              $machine = [Environment]::GetEnvironmentVariable("Path", "Machine")
              if ($machine -notlike "*$dir*") {
                  [Environment]::SetEnvironmentVariable("Path", "$machine;$dir", "Machine")
              }
              $env:Path = "$env:Path;$dir"
          }

          # 1) Java 21
          Start-Process msiexec.exe -ArgumentList "/i", "`"C:\Users\Public\Downloads\jdk21.msi`"", "/qn", "/norestart" -Wait
          $jdk = Get-ChildItem "C:\Program Files\Java" -Directory | Where-Object Name -like "jdk-21*" | Select-Object -First 1
          if (-not $jdk) { throw "JDK 21 not found after install" }
          [Environment]::SetEnvironmentVariable("JAVA_HOME", $jdk.FullName, "Machine")
          $env:JAVA_HOME = $jdk.FullName
          Add-MachinePath "$($jdk.FullName)\bin"
          Write-Host "Java installed: $($jdk.FullName)"

          # 2) Ghidra: extract to C:\Tools (readable by all logged-in users),
          #    add the GhidraMCP extension, create a desktop shortcut
          New-Item -ItemType Directory -Force -Path "C:\Tools" | Out-Null
          icacls "C:\Tools" /grant "*S-1-5-11:(OI)(CI)RX" | Out-Null

          Expand-Archive -Path "C:\Users\Public\Downloads\ghidra.zip" -DestinationPath "C:\Tools" -Force
          $ghidra = Get-ChildItem "C:\Tools" -Directory | Where-Object Name -like "ghidra_*" | Select-Object -First 1
          if (-not $ghidra) { throw "Ghidra folder not found after extract" }

          Copy-Item "C:\Users\Public\Downloads\GhidraMCP.zip" -Destination "$($ghidra.FullName)\Extensions\Ghidra\" -Force
          Expand-Archive -Path "C:\Users\Public\Downloads\GhidraMCP.zip" -DestinationPath "C:\Users\Public\Downloads\GhidraMCP" -Force
          Write-Host "GhidraMCP zip contents:"
          (Get-ChildItem "C:\Users\Public\Downloads\GhidraMCP" -Depth 1).FullName | Write-Host

          $shell = New-Object -ComObject WScript.Shell
          $lnk = $shell.CreateShortcut("C:\Users\Public\Desktop\Ghidra.lnk")
          $lnk.TargetPath = "$($ghidra.FullName)\ghidraRun.bat"
          $lnk.WorkingDirectory = $ghidra.FullName
          $lnk.Save()
          Write-Host "Ghidra ready: $($ghidra.FullName)"

          # 3) Qoder is a per-user installer, so put it on the desktop to run inside RDP
          Copy-Item "C:\Users\Public\Downloads\Qoder-win-x64-user.exe" -Destination "C:\Users\Public\Desktop\" -Force

          Write-Host "Phase 2a done"

      - name: Kit Phase 2b - Install for RDP user (uv, Ghidra bridge, Netlify CLI)
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          # Work folder the RDP user can write to (setup script + log)
          New-Item -ItemType Directory -Force -Path "C:\RdpSetup" | Out-Null
          icacls "C:\RdpSetup" /grant "RDP:(OI)(CI)M" | Out-Null

          # This script runs AS the RDP user, so everything lands in C:\Users\RDP
          $userScript = @'
          # Use Windows PowerShell's own module path (the parent runs PowerShell 7)
          $env:PSModulePath = "$env:ProgramFiles\WindowsPowerShell\Modules;$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          $ErrorActionPreference = "Continue"
          $ProgressPreference = 'SilentlyContinue'
          Start-Transcript -Path "C:\RdpSetup\install.log" -Force | Out-Null

          # The parent's environment is inherited, so USERPROFILE/TEMP/APPDATA still point to
          # the runner account. Point them at the RDP user's own profile instead.
          $profileDir = "C:\Users\RDP"
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $regPath = "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          $found = [Microsoft.Win32.Registry]::GetValue($regPath, "ProfileImagePath", $null)
          if ($found) { $profileDir = $found }
          if (-not (Test-Path $profileDir)) { throw "RDP profile folder not found: $profileDir" }

          $env:USERPROFILE  = $profileDir
          $env:HOME         = $profileDir
          $env:HOMEDRIVE    = $profileDir.Substring(0, 2)
          $env:HOMEPATH     = $profileDir.Substring(2)
          $env:APPDATA      = "$profileDir\AppData\Roaming"
          $env:LOCALAPPDATA = "$profileDir\AppData\Local"
          $env:TEMP         = "$profileDir\AppData\Local\Temp"
          $env:TMP          = $env:TEMP
          $env:USERNAME     = "RDP"
          foreach ($d in @($env:APPDATA, $env:LOCALAPPDATA, $env:TEMP)) {
              New-Item -ItemType Directory -Force -Path $d | Out-Null
          }
          Write-Host "Installing for profile: $profileDir"

          # uv (installs to C:\Users\RDP\.local\bin and adds it to the user's PATH)
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex" 2>&1 | Out-Host
          $uv = Join-Path $env:USERPROFILE ".local\bin\uv.exe"
          if (-not (Test-Path $uv)) {
              Write-Host "uv installer script failed, downloading uv directly instead..."
              $bin = Join-Path $env:USERPROFILE ".local\bin"
              $zip = Join-Path $env:TEMP "uv.zip"
              New-Item -ItemType Directory -Force -Path $bin | Out-Null
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              (New-Object Net.WebClient).DownloadFile("https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip", $zip)
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $bin)
              $up = [Environment]::GetEnvironmentVariable("Path", "User")
              if ($up -notlike "*$bin*") {
                  [Environment]::SetEnvironmentVariable("Path", (($up + ";" + $bin).Trim(";")), "User")
              }
          }
          if (-not (Test-Path $uv)) { throw "uv install failed" }
          Write-Host "uv installed: $uv"

          # Ghidra bridge
          & $uv tool install https://github.com/bethington/ghidra-mcp/releases/download/v7.0.0/ghidra_mcp_bridge-7.0.0-py3-none-any.whl 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Ghidra bridge install failed" }
          Write-Host "Ghidra bridge installed"

          # Netlify CLI (explicit prefix inside the user's profile)
          $npmDir = Join-Path $env:APPDATA "npm"
          npm install -g netlify-cli --prefix $npmDir 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "netlify-cli install failed" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*$npmDir*") {
              [Environment]::SetEnvironmentVariable("Path", (($userPath + ";" + $npmDir).Trim(";")), "User")
          }
          Write-Host "Netlify CLI installed"

          Stop-Transcript | Out-Null
          '@

          Set-Content -Path "C:\RdpSetup\install.ps1" -Value $userScript -Encoding UTF8

          # Run it as the RDP user; -LoadUserProfile creates C:\Users\RDP properly
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\RDP", $secure)

          $oldModulePath = $env:PSModulePath
          $env:PSModulePath = "$env:ProgramFiles\WindowsPowerShell\Modules;$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"

          $p = Start-Process -FilePath "powershell.exe" `
            -ArgumentList "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:\RdpSetup\install.ps1" `
            -Credential $cred -LoadUserProfile -WorkingDirectory "C:\RdpSetup" -Wait -PassThru

          $env:PSModulePath = $oldModulePath

          if (Test-Path "C:\RdpSetup\install.log") { Get-Content "C:\RdpSetup\install.log" | Write-Host }
          if ($p.ExitCode -ne 0) { throw "RDP user setup failed (exit code $($p.ExitCode)). See the log above." }

          Write-Host "Phase 2b done"

      - name: Keep Runner Alive
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"

          # Keep the runner alive silently (no output needed to stay running)
          while ($true) {
              Start-Sleep -Seconds 300
          }
